name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Unzip Project Files
      run: |
        mkdir -p ./temp_unzip
        unzip -o "my family 3..0.zip" -d ./temp_unzip

    - name: Install Cordova and Setup App
      run: |
        npm install -g cordova
        cordova create myapp com.myfamily.app MyFamily
        rm -rf myapp/www/*
        
        # Find index.html inside extracted files and copy all files to cordova www
        INDEX_PATH=$(find ./temp_unzip -name "index.html" | head -n 1)
        if [ -n "$INDEX_PATH" ]; then
          DIR_PATH=$(dirname "$INDEX_PATH")
          cp -r "$DIR_PATH"/* myapp/www/
        else
          cp -r ./temp_unzip/* myapp/www/
        fi

        cd myapp
        
        # Look for custom logo/icon image in extracted files and set as App Icon
        ICON_PATH=$(find ../temp_unzip -type f \( -iname "icon.png" -o -iname "logo.png" -o -iname "favicon.ico" -o -iname "*.png" \) | head -n 1)
        if [ -n "$ICON_PATH" ]; then
          cp "$ICON_PATH" icon.png
          sed -i '/<\/widget>/i \    <icon src="icon.png" />' config.xml
        fi

        # Disable HTTPS scheme issue in config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidInsecureFileModeEnabled" value="true" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="scheme" value="http" />' config.xml

        cordova platform add android
        cordova build android --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyFamily-APK
        path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
